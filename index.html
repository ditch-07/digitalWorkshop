<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Workshop | Coming Soon</title>
    <!-- Using Space Grotesk font for that clean, geometric neo-brutalist feel -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Color Palette derived from the Neo Brutalism style */
            --bg-color: #faede3;
            --card-bg: #ffffff;
            --primary-accent: #ff6a73; /* Vibrant Red */
            --secondary-accent: #ffdb57; /* Mustard Yellow */
            --tertiary-accent: #44ded0; /* Teal/Cyan */
            --border-color: #1a1a1a;
            
            /* Border and Shadow constants */
            --border-width: 3px;
            --border-radius: 8px;
            --hard-shadow: 5px 5px 0px 0px var(--border-color);
            --hard-shadow-hover: 2px 2px 0px 0px var(--border-color);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-color);
            color: var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Decorative Background Elements */
        .decor {
            position: absolute;
            border: var(--border-width) solid var(--border-color);
            z-index: 0;
        }

        .decor-1 {
            width: 40px;
            height: 40px;
            background-color: var(--tertiary-accent);
            border-radius: 50%;
            top: 15%;
            left: 15%;
            box-shadow: 3px 3px 0px 0px var(--border-color);
        }

        .decor-2 {
            width: 30px;
            height: 30px;
            background-color: var(--primary-accent);
            bottom: 20%;
            right: 15%;
            transform: rotate(15deg);
            box-shadow: 3px 3px 0px 0px var(--border-color);
        }
        
        .decor-3 {
            font-size: 2rem;
            border: none;
            top: 25%;
            right: 20%;
            color: var(--secondary-accent);
            text-shadow: 2px 2px 0px var(--border-color);
        }

        /* Main Container */
        .container {
            background-color: var(--secondary-accent);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--border-radius);
            box-shadow: var(--hard-shadow);
            max-width: 600px;
            width: 100%;
            padding: 40px;
            position: relative;
            z-index: 1;
            text-align: center;
        }

        /* Typography */
        .tag {
            display: inline-block;
            background-color: var(--primary-accent);
            color: white;
            font-size: 0.9rem;
            font-weight: 700;
            padding: 6px 16px;
            border: var(--border-width) solid var(--border-color);
            border-radius: 20px;
            box-shadow: 3px 3px 0px 0px var(--border-color);
            margin-bottom: 24px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 16px;
        }

        p {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        /* Form & Inputs */
        .notify-form {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .input-group {
            flex: 1;
            min-width: 250px;
        }

        input[type="email"] {
            width: 100%;
            padding: 16px;
            font-size: 1rem;
            font-family: inherit;
            font-weight: 600;
            background-color: var(--card-bg);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--border-radius);
            box-shadow: var(--hard-shadow);
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="email"]:focus {
            transform: translate(3px, 3px);
            box-shadow: var(--hard-shadow-hover);
        }

        button {
            padding: 16px 32px;
            font-size: 1rem;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
            background-color: var(--tertiary-accent);
            color: var(--border-color);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--border-radius);
            box-shadow: var(--hard-shadow);
            transition: all 0.2s ease;
        }

        button:hover {
            transform: translate(3px, 3px);
            box-shadow: var(--hard-shadow-hover);
        }

        /* Mobile Responsiveness */
        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            
            button {
                width: 100%;
            }

            .decor-1, .decor-2, .decor-3 {
                display: none; /* Hide floating decors on very small screens to avoid clutter */
            }
        }
    </style>
</head>
<body>

    <!-- Floating Background Shapes -->
    <div class="decor decor-1"></div>
    <div class="decor decor-2"></div>
    <div class="decor decor-3">✦</div>

    <!-- Main Content -->
    <div class="container">
        <div class="tag">Digital Workshop</div>
        <h1>Coming Soon</h1>
        <p>We are currently crafting a brand new experience. Drop your email below to get notified the second we launch.</p>
        
        <form class="notify-form" action="#" method="POST" onsubmit="event.preventDefault(); alert('Thanks for subscribing!');">
            <div class="input-group">
                <input type="email" placeholder="Enter your email address..." required>
            </div>
            <button type="submit">Notify Me</button>
        </form>
    </div>

</body>
</html>
